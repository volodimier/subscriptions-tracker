spring:
  main:
    lazy-initialization: true

  application:
    name: subscription-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: ${DEVTOOLS_ENABLED:false}
      additional-paths: src/main/java
    livereload:
      enabled: ${DEVTOOLS_ENABLED:false}

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

auth:
  registration-enabled: ${REGISTRATION_ENABLED:true}

totp:
  encryption-key: ${TOTP_ENCRYPTION_KEY:default-dev-key-change-in-prod!!}
  setup-token-expiration-seconds: 600
  partial-token-expiration-ms: 300000
  max-attempts: 5
  attempt-window-seconds: 30
  recovery-code-count: 10
  issuer: ${TOTP_ISSUER:PennyWise}

email:
  resend-api-key: ${RESEND_API_KEY:}
  from-address: ${EMAIL_FROM_ADDRESS:noreply@pennywise.app}
  from-name: ${EMAIL_FROM_NAME:PennyWise}
  token-expiration-hours: 48
  resend-rate-limit-seconds: 120
  verification-base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:5173}
  grace-period-days: 7
  verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}

fx-rate:
  api-key: ${FX_RATE_API_KEY:}
  base-url: https://v6.exchangerate-api.com/v6

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.subscriptiontracker: ${LOG_LEVEL_APP:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
