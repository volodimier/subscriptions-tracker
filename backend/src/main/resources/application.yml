spring:
  profiles:
    active: dev
  application:
    name: subscription-tracker
  jackson:
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET}  # Required - application will fail to start if not configured
  expiration: 86400000

fx-rate:
  api-key: ${FX_RATE_API_KEY:}
  base-url: https://v6.exchangerate-api.com/v6

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
