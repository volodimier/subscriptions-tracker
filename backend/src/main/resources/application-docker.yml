spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:subscription_user}
    password: ${SPRING_DATASOURCE_PASSWORD:subscription_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

jwt:
  secret: ${APP_JWT_SECRET:change-me-in-production}
  expiration: 86400000

fx-rate:
  api-key: ${APP_FX_RATE_API_KEY:}
  base-url: https://v6.exchangerate-api.com/v6

logging:
  level:
    com.subscriptiontracker: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
