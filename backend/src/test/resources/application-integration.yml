# Integration test configuration
# Database properties are set dynamically via @DynamicPropertySource

server:
  servlet:
    context-path: ""

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    hikari:
      # Validate connections before use to handle container timing issues
      connection-test-query: SELECT 1
      validation-timeout: 5000
      # Keep pool small for tests
      maximum-pool-size: 5
      minimum-idle: 1
      # Connection timeout - wait longer in CI
      connection-timeout: 30000
      # Validate idle connections
      idle-timeout: 30000

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Retry on connection failure
    connect-retries: 3

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.springframework.test: INFO
    org.springframework.boot: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: WARN
    com.subscriptiontracker: DEBUG
