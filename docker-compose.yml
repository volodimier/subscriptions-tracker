services:
  subscription-tracker:
    build: .
    container_name: subscription-tracker
    ports:
      - "80:80"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-subscription_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-subscription_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - FX_RATE_API_KEY=${FX_RATE_API_KEY:-}
    volumes:
      - subscription_tracker_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  subscription_tracker_data:
