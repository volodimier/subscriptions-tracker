name: CI

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        working-directory: .

      - name: Run tests with Gradle
        working-directory: backend
        run: ./gradlew cleanTest test jacocoTestReport
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Check for skipped tests
        working-directory: backend
        run: |
          SKIPPED_COUNT=$(grep -oh 'skipped="[0-9]*"' build/test-results/test/*.xml 2>/dev/null | grep -oh '[0-9]*' | awk '{sum+=$1} END {print sum+0}')
          if [ "$SKIPPED_COUNT" -gt 0 ]; then
            echo "::error::$SKIPPED_COUNT test(s) were skipped. This indicates a configuration problem."
            exit 1
          fi
          echo "All tests executed successfully (no skipped tests)"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint check
        working-directory: frontend
        run: npm run lint:check

      - name: Run type check
        working-directory: frontend
        run: npm run type-check

      - name: Run tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verify
          push: false
          load: true
          tags: subscription-tracker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container health
        run: |
          docker run -d --name test-container \
            -e POSTGRES_PASSWORD=ci_test_password_123 \
            -e JWT_SECRET=$(openssl rand -base64 32) \
            -e FX_RATE_API_KEY=test_key \
            -p 8080:80 \
            subscription-tracker:test

          echo "Waiting for container to become healthy..."
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' test-container)
            echo "Attempt $i/24: Status = $STATUS"
            if [ "$STATUS" == "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi
            sleep 5
          done

          echo "Container failed to become healthy"
          exit 1

      - name: Print container logs
        if: always()
        run: |
          echo "=== Container logs ==="
          docker logs test-container 2>&1 || true

      - name: Cleanup test container
        if: always()
        run: docker rm -f test-container 2>/dev/null || true
