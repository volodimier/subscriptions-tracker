[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log

[program:backend]
command=/app/run-backend.sh
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=30
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/%(ENV_POSTGRES_DB)s",SPRING_DATASOURCE_USERNAME="%(ENV_POSTGRES_USER)s",SPRING_DATASOURCE_PASSWORD="%(ENV_POSTGRES_PASSWORD)s",APP_JWT_SECRET="%(ENV_JWT_SECRET)s",APP_FX_RATE_API_KEY="%(ENV_FX_RATE_API_KEY)s",SPRING_PROFILES_ACTIVE="%(ENV_SPRING_PROFILES_ACTIVE)s"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
