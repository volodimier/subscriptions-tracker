[supervisord]
nodaemon=true
user=root
loglevel=info

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=/app/run-backend.sh
directory=/workspace/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=JAVA_DEBUG="%(ENV_JAVA_DEBUG)s",SPRING_PROFILES_ACTIVE="docker",SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/%(ENV_POSTGRES_DB)s",SPRING_DATASOURCE_USERNAME="%(ENV_POSTGRES_USER)s",SPRING_DATASOURCE_PASSWORD="%(ENV_POSTGRES_PASSWORD)s",APP_JWT_SECRET="%(ENV_JWT_SECRET)s",APP_FX_RATE_API_KEY="%(ENV_FX_RATE_API_KEY)s"
stopwaitsecs=30

[program:frontend]
command=/app/run-frontend.sh
directory=/workspace/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25
stopwaitsecs=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
