services:
  subscription-tracker-verify:
    build: .
    container_name: subscription-tracker-verify
    ports:
      - "8888:80"
    environment:
      - POSTGRES_DB=subscription_tracker_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - JWT_SECRET=test_jwt_secret_for_automated_testing_only_32chars
      - CORS_ALLOWED_ORIGINS=http://localhost:8888
      - FX_RATE_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/auth/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Playwright container for E2E tests
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    container_name: playwright-tests
    working_dir: /app
    volumes:
      - ./e2e:/app
      - ./e2e/test-results:/app/test-results
    environment:
      - BASE_URL=http://subscription-tracker-verify
    depends_on:
      subscription-tracker-verify:
        condition: service_healthy
    command: ["npx", "playwright", "test"]
