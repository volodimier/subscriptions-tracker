services:
  subscription-tracker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: subscription-tracker-dev
    env_file:
      - .env.dev
    ports:
      - "8889:80"      # Nginx proxy (main app access)
      - "5173:5173"    # Vite dev server (direct access)
      - "5433:5432"    # PostgreSQL exposed for IntelliJ database connection
      - "5005:5005"    # Java remote debug port
    environment:
      - POSTGRES_DB=subscription_tracker_dev
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
      - JWT_SECRET=dev_jwt_secret_for_local_development_32chars
      - CORS_ALLOWED_ORIGINS=http://localhost:8889,http://localhost:5173
      - EXPOSE_POSTGRES=true
      - JAVA_DEBUG=true
      - VITE_API_BASE_URL=http://localhost:8889/api
    volumes:
      - subscription_tracker_dev_data:/var/lib/postgresql/data
      - ./backend:/workspace/backend
      - ./frontend:/workspace/frontend
      - gradle-cache:/root/.gradle
      - node-modules:/workspace/frontend/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 15

volumes:
  subscription_tracker_dev_data:
  gradle-cache:
  node-modules:
